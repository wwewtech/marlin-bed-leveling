<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <style>
      .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
      .title { font-weight: 700; font-size: 28px; letter-spacing: -0.03em; fill: #ededed; }
      .sub { font-size: 14px; fill: #888888; }
      .label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
      .code { font-size: 13px; line-height: 1.6; }
      .red { fill: #f87171; }
      .green { fill: #34d399; }
      .blue { fill: #60a5fa; }
      .dim { fill: #52525b; }
      .text-light { fill: #e4e4e7; }
      .amber { fill: #fbbf24; }
    </style>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="1200" height="480" fill="#000000"/>

  <!-- Outer Frame -->
  <rect x="20" y="20" width="1160" height="440" rx="8" fill="#09090b" stroke="#27272a" stroke-width="1"/>

  <!-- Header Bar -->
  <line x1="20" y1="76" x2="1180" y2="76" stroke="#27272a" stroke-width="1"/>

  <!-- Left Header: Project Identity -->
  <g transform="translate(44, 48)">
    <rect x="0" y="-14" width="22" height="22" rx="4" fill="#06b6d4"/>
    <path d="M 4 2 L 11 -8 L 18 2 M 11 -8 L 11 8" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
    <text x="32" y="3" class="mono text-light" font-size="14" font-weight="600">marlin-bed-leveling</text>
    <text x="210" y="3" class="mono dim" font-size="14">/ UBL · Bilinear · MBL</text>
  </g>

  <!-- Right Header: Status Telemetry -->
  <g transform="translate(1156, 48)">
    <text x="0" y="2" text-anchor="end" class="mono label dim">LEVELING STATE: <tspan fill="#34d399">M420 S1 ACTIVE (FADE Z=10.0mm)</tspan></text>
  </g>

  <!-- Split View Dividers -->
  <line x1="600" y1="76" x2="600" y2="416" stroke="#27272a" stroke-width="1"/>
  <line x1="20" y1="416" x2="1180" y2="416" stroke="#27272a" stroke-width="1"/>

  <!-- LEFT PANE: Forgotten M420 S1 & Crash (Rejected) -->
  <g transform="translate(44, 108)">
    <text x="0" y="0" class="mono label red">FLAWED SLICER G-CODE: SILENT MESH DISABLE (REJECTED)</text>
    
    <g transform="translate(0, 32)" class="mono code">
      <text y="0" class="dim">01 <tspan class="red">G28 ; Home all axes</tspan></text>
      <text y="24" class="dim">02 <tspan class="dim">; FATAL: G28 disables bed leveling in Marlin!</tspan></text>
      <text y="48" class="dim">03 <tspan class="red">; Missing M420 S1 --&gt; entire print runs UNLEVEL</tspan></text>
      <text y="72" class="dim">04 <tspan class="red">M851 Z+1.5  ; Positive Z-offset crashes nozzle into PEI</tspan></text>
      <text y="96" class="dim">05 <tspan class="dim">; Cold bed probing at 20°C ambient:</tspan></text>
      <text y="120" class="dim">06 <tspan class="red">G29 P1      ; Warps by 0.15mm once heated to 60°C</tspan></text>
      <text y="144" class="dim">07 <tspan class="red">; No M500 commit --&gt; mesh erased on power cycle</tspan></text>
      <text y="168" class="dim">08 <tspan class="red">G1 Z0.2 F3000 ; First layer scrapes and clogs hotend</tspan></text>
    </g>

    <g transform="translate(0, 240)">
      <rect width="510" height="42" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
      <text x="14" y="25" class="mono red" font-size="12">&#x2717; Leveling disabled by G28 | Nozzle bed crash | Cold warp</text>
    </g>
  </g>

  <!-- RIGHT PANE: Production UBL Pipeline (Verified) -->
  <g transform="translate(640, 108)">
    <text x="0" y="0" class="mono label green">PRODUCTION: THERMAL SOAK &amp; POST-HOMING RESTORE</text>
    
    <g transform="translate(0, 32)" class="mono code">
      <text y="0" class="dim">01 <tspan class="blue">M190 S60</tspan> &amp; <tspan class="blue">G4 S300</tspan>    <tspan class="green">; 5-minute thermal stabilization</tspan></text>
      <text y="24" class="dim">02 G28                   <tspan class="dim">; Home all axes</tspan></text>
      <text y="48" class="dim">03 <tspan class="green">M420 S1 Z10.0</tspan>         <tspan class="green">; Re-enable mesh with 10mm fade</tspan></text>
      <text y="72" class="dim">04 <tspan class="blue">M851 Z-1.85</tspan>           <tspan class="green">; Negative offset for downward probe</tspan></text>
      <text y="96" class="dim">05 G29 P1 &amp; G29 P3 T0.0  <tspan class="blue">; Probe grid &amp; extrapolate edges</tspan></text>
      <text y="120" class="dim">06 <tspan class="amber">G29 S1 &amp; M500</tspan>         <tspan class="amber">; Commit to EEPROM slot 1 &amp; flash</tspan></text>
      <text y="144" class="dim">07 G26 B60 H210 F1.75    <tspan class="green">; Print single-layer mesh validation</tspan></text>
      <text y="168" class="dim">08 <tspan class="green">M48 P10</tspan>               <tspan class="green">; Confirm probe repeatability (s &lt;= 0.005mm)</tspan></text>
    </g>

    <g transform="translate(0, 240)">
      <rect width="510" height="42" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="14" y="25" class="mono green" font-size="12">&#x2713; Leveling guaranteed ON | Negative offset safe | EEPROM flash saved</text>
    </g>
  </g>

  <!-- Footer Telemetry -->
  <g transform="translate(44, 442)">
    <text class="mono dim" font-size="12">KINEMATICS: <tspan class="text-light">Cartesian / CoreXY (Marlin 2.x)</tspan></text>
    <text x="440" class="mono dim" font-size="12">PROBES: <tspan class="green">BLTouch · CRTouch · Inductive · PINDA</tspan></text>
    <text x="830" class="mono dim" font-size="12">GRID: <tspan class="text-light">5x5 / 7x7 Mesh Interpolation</tspan></text>
    <text x="1112" text-anchor="end" class="mono green" font-size="12">&#x25CF; FIRST-LAYER LOCKED</text>
  </g>
</svg>
